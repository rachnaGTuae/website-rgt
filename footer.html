<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Footer with Center Social Icons</title>

  <!-- Font Awesome (icons) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- Inter font (optional, match your site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --footer-top:#3f3f3f;
      --footer-mid:#1a1a1a;
      --footer-bot:#4a4a4a;
      --white:#fff;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff;
      color:#111;
    }

    /* ===== FOOTER WRAP ===== */
    .giii-footer{ width:100%; }

    .giii-container{
      max-width:1200px;
      margin:0 auto;
      padding:0 16px;
    }

    /* ===== TOP BAR (SOCIAL CENTER) ===== */
    .giii-footer-top{
      background:var(--footer-top);
      padding:14px 0;
    }

    .giii-social{
      display:flex;
      align-items:center;
      justify-content:center;    /* CENTER ICONS */
      gap:14px;
      list-style:none;
      margin:0;
      padding:0;
      flex-wrap:wrap;
    }

    .giii-social a{
      color:var(--white);
      opacity:.9;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:34px;
      height:34px;
      border-radius:999px;
      transition: opacity .15s ease, transform .15s ease, background .15s ease;
    }

    .giii-social a:hover{
      opacity:1;
      transform: translateY(-1px);
      background: rgba(255,255,255,.10);
    }

    .giii-social i{ font-size:14px; }

    .giii-sep{
      color: rgba(255,255,255,.55);
      opacity:.9;
      font-size:12px;
      line-height:1;
      user-select:none;
    }

    /* ===== MID BAR (ADDRESS CENTER) ===== */
    .giii-footer-mid{
      background:var(--footer-mid);
      color:var(--white);
      text-align:center;
      padding:10px 0;
      font-size:12px;
      letter-spacing:.02em;
      opacity:.9;
    }

    /* ===== BOTTOM BAR (COPYRIGHT CENTER) ===== */
    .giii-footer-bot{
      background:var(--footer-bot);
      color:var(--white);
      text-align:center;
      padding:10px 0;
      font-size:12px;
      opacity:.9;
    }

    /* ===== MOBILE TUNING ===== */
    @media (max-width: 575.98px){
      .giii-footer-top{ padding:12px 0; }
      .giii-social{ gap:12px; }
      .giii-social a{
        width:32px;
        height:32px;
      }
      .giii-footer-mid,
      .giii-footer-bot{
        font-size:11px;
        padding:9px 0;
      }
    }
  </style>
</head>

<body>
